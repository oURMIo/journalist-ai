name: Gradle Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

# head_ref on a pull_request and ref_name on a push are both the branch name, so
# a branch with an open PR runs this once instead of twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build with Gradle
        run: ./gradlew clean build -x test
        working-directory: ${{ env.PROJECT_DIR }}

      # The boot jar is ~90 MB, so it is kept for master only.
      - name: Upload boot jar
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: journalist-jar
          path: app/build/libs/journalist-*-SNAPSHOT.jar
          retention-days: 7
          if-no-files-found: error
