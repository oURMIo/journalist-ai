name: Docker

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  compose:
    name: Validate docker compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # .env is git-ignored; compose needs one to interpolate DB_USER and friends.
      - name: Seed .env from the example
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config --quiet

  image:
    name: Build bot image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          load: false
          tags: journalist:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
