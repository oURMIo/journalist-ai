services:
  db:
    image: postgres:16-alpine
    container_name: journalist-db
    environment:
      POSTGRES_DB: newsbot
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d newsbot"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # Local model that writes the 1-3 sentence recap under every headline.
  # No API key, no per-article cost, and nothing leaves this compose network.
  ollama:
    image: ollama/ollama:latest
    container_name: journalist-ollama
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # llama3.2:3b needs roughly 2.5 GB. Raise this before switching to a
          # larger model, or it will be killed mid-generation.
          memory: 3g

  # One-shot: downloads the model on first start, then exits. The named volume
  # keeps it, so later restarts finish immediately.
  ollama-init:
    image: ollama/ollama:latest
    container_name: journalist-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3.2:3b}"]
    restart: "no"

  bot:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: journalist
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/newsbot
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
  ollama-data:
