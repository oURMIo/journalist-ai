# All user-facing bot texts live here (spec 9a: do not hardcode them in Java).
# Placeholders are {name} tokens substituted by MessageTemplates.render(...).
messages:
  welcome: |
    📌 <b>News topic: {slug}</b>

    This topic is filled automatically with news about "<b>{slug}</b>".

    • Sources: {sources}
    • News language: English
    • Refresh interval: every {interval} min
    • At most {maxItems} news items at a time

    Each post contains: headline, short summary, date and time (UTC), link to the original.

    To start another topic — create a forum topic named <code>{prefix}&lt;topic&gt;</code>
    or send the command <code>/newtopic &lt;topic&gt;</code>.
  sources-fallback: "search across all English-language sources"
  sources-more: "and {count} more"
  help: |
    🗞 <b>Journalist — news bot</b>

    I post fresh English-language news into topics whose name starts with <code>{prefix}</code>.
    Create a topic <code>{prefix}biotech</code> — and I will start sending biotech news there.

    <b>Commands</b>
    /help — this help
    /newtopic &lt;topic&gt; — create a news topic
    /newtopics &lt;t1&gt; &lt;t2&gt; … — create several topics
    /presets — available topic presets
    /bind [name] — bind the current topic (for topics created before the bot)
    /unbind — unbind the current topic
    /renametopic &lt;topic&gt; — rename the current topic
    /closetopic — close the current topic
    /filter — news filters of this topic
    /exclude &lt;words&gt; — do not send news about this
    /include &lt;words&gt; — send only news about this
    /query — what and where I search for this topic, and how to change it
    /topics — topic registry
    /status — polling state
    /now — poll the current topic right now
  not-admin: "This command is available to bot administrators only."
  not-in-topic: "Send this command inside a news topic."
  bind-usage: "Specify the topic name: <code>/bind {prefix}&lt;topic&gt;</code> — send this message inside the topic you mean."
  bind-not-news: "The name <code>{name}</code> does not start with <code>{prefix}</code> — I do not track such a topic."
  bind-ok: "Topic bound: <b>{name}</b> (subject: <code>{slug}</code>)."
  unbind-ok: "Topic unbound, news will no longer be posted here."
  unbind-unknown: "This topic is not in the registry."
  newtopic-usage: "Specify the topic: <code>/newtopic biotech</code>"
  newtopics-usage: "Specify the topics separated by spaces: <code>/newtopics it science ai</code>"
  rename-usage: "Specify the new topic: <code>/renametopic ai-safety</code>"
  now-started: "Polling topic <code>{slug}</code> right now…"
  now-done: "Polling of topic <code>{slug}</code> finished: news sent — {sent}."
  topics-empty: "The topic registry is empty."
  presets-header: "<b>Available topic presets</b>"
  presets-fallback-note: "A topic without a preset works too — via Google News search."
  closetopic-ok: "Closing the topic."
  filter-usage: |
    <b>News filters</b>
    <code>/filter</code> — show the filters of this topic
    <code>/exclude go, crypto</code> — do not send news about this
    <code>/include kubernetes</code> — send only news about this
    <code>/filter remove go</code> — drop a filter
    <code>/filter clear</code> — drop all filters

    Terms are separated by commas; a phrase is written in full: <code>/exclude machine learning</code>
  filter-header: "<b>Filters of topic {slug}</b>"
  filter-empty: "Topic <code>{slug}</code> has no filters — all news on the subject comes through."
  filter-exclude-label: "🚫 Do not send:"
  filter-include-label: "✅ Only about:"
  filter-ai-on: "🤖 AI additionally filters articles by meaning, not only by exact word match."
  filter-ai-off: "🤖 AI check is off — I compare by exact word match only."
  filter-added: "Filter updated ({kind}): {terms}"
  filter-nothing-added: "Nothing added: such filters already exist."
  filter-limit: "Reached the limit of {max} filters per topic, the rest was not added."
  filter-removed: "Filter dropped: {terms}"
  filter-not-found: "The topic has no such filter: {terms}"
  filter-cleared: "Dropped all filters of the topic: {count}."
  filter-kind-exclude: "do not send"
  filter-kind-include: "only about"
  topic-profile-derived: |
    🎯 <b>Topic "{slug}"</b> — subject area detected

    This is about: {domain}
    Search query: <code>{query}</code>

    If the topic was understood wrong — set the query yourself: <code>/query &lt;words&gt;</code>
  query-header: |
    🔎 <b>Topic "{slug}"</b>

    This is about: {domain}
    Search query: <code>{query}</code>
    Query taken: {source}
  query-feeds: "Plus curated feeds: {count}"
  query-domain-unknown: "not determined yet — I will determine it on the next poll"
  query-domain-dropped: "not used — the query is set manually; to bring it back: <code>/query auto</code>"
  query-source-slug: "from the topic name"
  query-source-preset: "from the topic preset"
  query-source-model: "determined by AI from the topic name"
  query-source-user: "set manually"
  query-usage: |
    <b>Search query of the topic</b>
    <code>/query</code> — show what and where I search
    <code>/query "java programming" OR jvm OR jdk</code> — search exactly this
    <code>/query auto</code> — restore automatic topic detection

    Google News syntax works: <code>OR</code>, quotes for a phrase, <code>-word</code> — to exclude.
    Your own query also cancels topic detection: from then on I filter by your words only.
  query-set: |
    Query updated: <code>{query}</code>

    Check it right away — <code>/now</code>.
  query-reset: |
    Restored automatic topic detection. I will determine it again on the next poll — or right now via <code>/now</code>.
