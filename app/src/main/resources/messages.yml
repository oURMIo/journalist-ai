# All user-facing bot texts live here (spec 9a: do not hardcode them in Java).
# Placeholders are {name} tokens substituted by MessageTemplates.render(...).
messages:
  welcome: |
    📌 <b>News topic: {slug}</b>

    Этот топик автоматически наполняется новостями по теме «<b>{slug}</b>».

    • Источники: {sources}
    • Язык новостей: English
    • Интервал обновления: каждые {interval} мин
    • Не более {maxItems} новостей за раз

    Формат каждой публикации: заголовок, краткий пересказ, дата и время (UTC), ссылка на оригинал.

    Чтобы завести ещё одну тему — создайте топик с именем <code>{prefix}&lt;тема&gt;</code>
    или отправьте команду <code>/newtopic &lt;тема&gt;</code>.
  sources-fallback: "поиск по всем англоязычным источникам"
  sources-more: "и ещё {count}"
  help: |
    🗞 <b>Journalist — news bot</b>

    Я публикую свежие англоязычные новости в топики, имя которых начинается с <code>{prefix}</code>.
    Создайте топик <code>{prefix}biotech</code> — и я начну слать туда новости про биотех.

    <b>Команды</b>
    /help — эта справка
    /newtopic &lt;тема&gt; — создать новостной топик
    /newtopics &lt;т1&gt; &lt;т2&gt; … — создать несколько топиков
    /presets — доступные пресеты тематик
    /bind [имя] — привязать текущий топик (для топиков, созданных до бота)
    /unbind — отвязать текущий топик
    /renametopic &lt;тема&gt; — переименовать текущий топик
    /closetopic — закрыть текущий топик
    /filter — фильтры новостей этого топика
    /exclude &lt;слова&gt; — не присылать новости про это
    /include &lt;слова&gt; — присылать только про это
    /query — что и где я ищу по этой теме, и как это поправить
    /topics — реестр топиков
    /status — состояние опроса
    /now — внеочередной опрос текущего топика
  not-admin: "Команда доступна только администраторам бота."
  not-in-topic: "Эту команду нужно отправлять внутри новостного топика."
  bind-usage: "Укажите имя топика: <code>/bind {prefix}&lt;тема&gt;</code> — отправьте это сообщение внутри нужного топика."
  bind-not-news: "Имя <code>{name}</code> не начинается с <code>{prefix}</code> — такой топик я не отслеживаю."
  bind-ok: "Топик привязан: <b>{name}</b> (тема: <code>{slug}</code>)."
  unbind-ok: "Топик отвязан, новости сюда больше не приходят."
  unbind-unknown: "Этот топик не числится в реестре."
  newtopic-usage: "Укажите тему: <code>/newtopic biotech</code>"
  newtopics-usage: "Укажите темы через пробел: <code>/newtopics it science ai</code>"
  rename-usage: "Укажите новую тему: <code>/renametopic ai-safety</code>"
  now-started: "Запускаю внеочередной опрос темы <code>{slug}</code>…"
  now-done: "Опрос темы <code>{slug}</code> завершён: отправлено новостей — {sent}."
  topics-empty: "Реестр топиков пуст."
  presets-header: "<b>Доступные пресеты тематик</b>"
  presets-fallback-note: "Тема без пресета тоже работает — через поиск Google News."
  closetopic-ok: "Закрываю топик."
  filter-usage: |
    <b>Фильтры новостей</b>
    <code>/filter</code> — показать фильтры этого топика
    <code>/exclude go, крипта</code> — не присылать новости про это
    <code>/include kubernetes</code> — присылать только про это
    <code>/filter remove go</code> — снять фильтр
    <code>/filter clear</code> — снять все фильтры

    Термины разделяются запятыми; фраза пишется целиком: <code>/exclude machine learning</code>
  filter-header: "<b>Фильтры топика {slug}</b>"
  filter-empty: "У топика <code>{slug}</code> фильтров нет — приходят все новости по теме."
  filter-exclude-label: "🚫 Не присылать:"
  filter-include-label: "✅ Только про:"
  filter-ai-on: "🤖 ИИ дополнительно отсеивает статьи по смыслу, а не только по точному слову."
  filter-ai-off: "🤖 Проверка ИИ выключена — сравниваю только по точному слову."
  filter-added: "Фильтр обновлён ({kind}): {terms}"
  filter-nothing-added: "Ничего не добавил: такие фильтры уже есть."
  filter-limit: "Достигнут лимит в {max} фильтров на топик, лишнее не добавил."
  filter-removed: "Фильтр снят: {terms}"
  filter-not-found: "Такого фильтра у топика нет: {terms}"
  filter-cleared: "Снял все фильтры топика: {count}."
  filter-kind-exclude: "не присылать"
  filter-kind-include: "только про"
  topic-profile-derived: |
    🎯 <b>Тема «{slug}»</b> — определил область интересов

    Это про: {domain}
    Ищу по запросу: <code>{query}</code>

    Если тема понята неверно — задайте запрос сами: <code>/query &lt;слова&gt;</code>
  query-header: |
    🔎 <b>Тема «{slug}»</b>

    Это про: {domain}
    Ищу по запросу: <code>{query}</code>
    Запрос взят: {source}
  query-feeds: "Плюс курируемых лент: {count}"
  query-domain-unknown: "пока не определено — определю при следующем опросе"
  query-domain-dropped: "не используется — запрос задан вручную; вернуть: <code>/query auto</code>"
  query-source-slug: "из имени топика"
  query-source-preset: "из пресета тематики"
  query-source-model: "определён ИИ по имени топика"
  query-source-user: "задан вручную"
  query-usage: |
    <b>Поисковый запрос топика</b>
    <code>/query</code> — показать, что и где я ищу
    <code>/query "java programming" OR jvm OR jdk</code> — искать именно это
    <code>/query auto</code> — вернуть автоопределение темы

    Работает синтаксис Google News: <code>OR</code>, кавычки для фразы, <code>-слово</code> — исключить.
    Свой запрос отменяет и определение темы: дальше фильтрую только по вашим словам.
  query-set: |
    Запрос обновлён: <code>{query}</code>

    Проверить сразу — <code>/now</code>.
  query-reset: |
    Вернул автоопределение темы. Определю её заново при следующем опросе — или сразу через <code>/now</code>.
